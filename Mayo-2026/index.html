<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revista Breves</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1c1c1c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #loader {
      color: #ccc;
      font-size: 18px;
      position: absolute;
      text-align: center;
      padding: 20px;
    }

    #visor {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      height: 100vh;
      justify-content: center;
      gap: 10px;
    }

    #canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      padding: 10px 10px 0 10px;
    }

    canvas {
      max-width: 100%;
      max-height: 85vh;
      display: block;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      background: white;
    }

    .controles {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 0 12px 0;
    }

    .btn {
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 10px 26px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover { background: #555; }
    .btn:disabled { opacity: 0.35; cursor: default; }

    #indicador {
      color: #bbb;
      font-size: 15px;
      min-width: 90px;
      text-align: center;
    }

    #btn-fs {
      position: fixed;
      top: 12px; right: 12px;
      background: rgba(0,0,0,0.55);
      color: white;
      border: 1px solid #666;
      padding: 7px 12px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 999;
      transition: background 0.2s;
    }
    #btn-fs:hover { background: rgba(0,0,0,0.9); }
  </style>
</head>
<body>

  <div id="loader">Cargando revista...</div>
  <button id="btn-fs" style="display:none">⛶ Pantalla completa</button>

  <div id="visor">
    <div id="canvas-wrapper">
      <canvas id="pdf-canvas"></canvas>
    </div>
    <div class="controles">
      <button class="btn" id="btn-prev">◀ Anterior</button>
      <span id="indicador">1 / 1</span>
      <button class="btn" id="btn-next">Siguiente ▶</button>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const pdfUrl    = 'revista.pdf';
    const canvas    = document.getElementById('pdf-canvas');
    const ctx       = canvas.getContext('2d');
    const loader    = document.getElementById('loader');
    const visor     = document.getElementById('visor');
    const indicador = document.getElementById('indicador');
    const btnPrev   = document.getElementById('btn-prev');
    const btnNext   = document.getElementById('btn-next');
    const btnFs     = document.getElementById('btn-fs');

    let pdfDoc      = null;
    let currentPage = 1;
    let rendering   = false;

    async function renderPage(num) {
      if (rendering) return;
      rendering = true;

      const page     = await pdfDoc.getPage(num);
      const devicePR = window.devicePixelRatio || 1;

      // Calcular escala para que llene la pantalla disponible
      const maxW = window.innerWidth  * 0.96;
      const maxH = window.innerHeight * 0.84;
      const vp1  = page.getViewport({ scale: 1 });
      const scale = Math.min(maxW / vp1.width, maxH / vp1.height) * devicePR;

      const viewport    = page.getViewport({ scale });
      canvas.width      = viewport.width;
      canvas.height     = viewport.height;
      canvas.style.width  = `${viewport.width  / devicePR}px`;
      canvas.style.height = `${viewport.height / devicePR}px`;

      ctx.imageSmoothingEnabled  = true;
      ctx.imageSmoothingQuality  = 'high';

      await page.render({ canvasContext: ctx, viewport, intent: 'print' }).promise;

      indicador.textContent = `${num} / ${pdfDoc.numPages}`;
      btnPrev.disabled = num <= 1;
      btnNext.disabled = num >= pdfDoc.numPages;
      rendering = false;
    }

    async function init() {
      try {
        pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
        loader.style.display = 'none';
        visor.style.display  = 'flex';
        btnFs.style.display  = 'block';
        await renderPage(currentPage);
      } catch (e) {
        loader.innerText = 'Error al cargar revista.pdf. Verificá que el archivo esté en la misma carpeta.';
        console.error(e);
      }
    }

    btnPrev.addEventListener('click', async () => {
      if (currentPage > 1) { currentPage--; await renderPage(currentPage); }
    });
    btnNext.addEventListener('click', async () => {
      if (currentPage < pdfDoc.numPages) { currentPage++; await renderPage(currentPage); }
    });

    // Teclas del teclado
    document.addEventListener('keydown', async e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        if (currentPage < pdfDoc.numPages) { currentPage++; await renderPage(currentPage); }
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        if (currentPage > 1) { currentPage--; await renderPage(currentPage); }
      }
    });

    // Swipe en celular
    let touchX = 0;
    canvas.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
    canvas.addEventListener('touchend', async e => {
      const diff = touchX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) {
        if (diff > 0 && currentPage < pdfDoc.numPages) { currentPage++; await renderPage(currentPage); }
        if (diff < 0 && currentPage > 1)               { currentPage--; await renderPage(currentPage); }
      }
    }, { passive: true });

    // Pantalla completa
    btnFs.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(console.error);
      } else {
        document.exitFullscreen();
      }
    });
    document.addEventListener('fullscreenchange', () => {
      renderPage(currentPage);
    });

    // Re-renderizar si cambia el tamaño de ventana
    window.addEventListener('resize', () => { renderPage(currentPage); });

    init();
  </script>
</body>
</html>
