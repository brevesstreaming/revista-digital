<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revista Breves</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1c1c1c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #loader {
      color: #ccc;
      font-size: 18px;
      position: absolute;
      text-align: center;
      padding: 20px;
    }

    #book-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      width: 100%;
      padding: 10px;
    }

    /* El contenedor del flipbook — tamaño calculado en JS */
    #book-container {
      display: none;
      cursor: pointer;
    }

    .page {
      background: white;
      overflow: hidden;
    }

    /* Canvas ocupa exactamente el div de página — sin estiramientos */
    .page canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: auto;
    }

    .controles {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 0 14px;
      z-index: 10;
    }

    .btn {
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 10px 24px;
      font-size: 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
      touch-action: manipulation;
    }
    .btn:hover  { background: #555; }
    .btn:disabled { opacity: 0.3; cursor: default; }

    #indicador {
      color: #bbb;
      font-size: 14px;
      min-width: 80px;
      text-align: center;
    }

    #btn-fs {
      position: fixed;
      top: 12px; right: 12px;
      background: rgba(0,0,0,0.55);
      color: white;
      border: 1px solid #666;
      padding: 7px 12px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 999;
      display: none;
    }
    #btn-fs:hover { background: rgba(0,0,0,0.9); }
  </style>
</head>
<body>

  <div id="loader">Cargando revista...</div>
  <button id="btn-fs">⛶ Pantalla completa</button>

  <div id="book-wrapper">
    <div id="book-container"></div>
  </div>

  <div class="controles" id="controles" style="display:none">
    <button class="btn" id="btn-prev">◀ Anterior</button>
    <span id="indicador">1 / 1</span>
    <button class="btn" id="btn-next">Siguiente ▶</button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const pdfUrl = 'revista.pdf';

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const pdf           = await pdfjsLib.getDocument(pdfUrl).promise;
        const numPages      = pdf.numPages;
        const bookContainer = document.getElementById('book-container');
        const loader        = document.getElementById('loader');
        const controles     = document.getElementById('controles');
        const btnFs         = document.getElementById('btn-fs');
        const indicador     = document.getElementById('indicador');
        const btnPrev       = document.getElementById('btn-prev');
        const btnNext       = document.getElementById('btn-next');

        // Tamaño de una página para que llene la pantalla
        const firstPage = await pdf.getPage(1);
        const vp1       = firstPage.getViewport({ scale: 1 });
        const ratio     = vp1.width / vp1.height;

        const availW = window.innerWidth  * 0.94;
        const availH = window.innerHeight * 0.84;

        let pgH = availH;
        let pgW = pgH * ratio;
        if (pgW > availW) { pgW = availW; pgH = pgW / ratio; }

        pgW = Math.round(pgW);
        pgH = Math.round(pgH);

        bookContainer.style.width  = pgW + 'px';
        bookContainer.style.height = pgH + 'px';

        // Escala de renderizado de alta calidad
        const dpr         = window.devicePixelRatio || 1;
        const renderScale = Math.max(2.5, dpr * 2);

        // Renderizar todas las páginas en canvas
        for (let i = 1; i <= numPages; i++) {
          loader.innerText = `Cargando página ${i} de ${numPages}...`;
          const page     = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: renderScale });

          const canvas  = document.createElement('canvas');
          const ctx     = canvas.getContext('2d');
          canvas.width  = viewport.width;
          canvas.height = viewport.height;
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          await page.render({ canvasContext: ctx, viewport, intent: 'print' }).promise;

          const div = document.createElement('div');
          div.className = 'page';
          div.style.width  = pgW + 'px';
          div.style.height = pgH + 'px';
          div.appendChild(canvas);
          bookContainer.appendChild(div);
        }

        loader.style.display        = 'none';
        bookContainer.style.display = 'block';
        controles.style.display     = 'flex';
        btnFs.style.display         = 'block';

        // PageFlip — UNA sola página (width = pgW, no pgW/2)
        const pageFlip = new St.PageFlip(bookContainer, {
          width:        pgW,
          height:       pgH,
          showCover:    true,
          usePortrait:  true,
          autoSize:     false,
          drawShadow:   true,
          flippingTime: 700,
          maxShadowOpacity: 0.4,
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        function updateUI() {
          const cur = pageFlip.getCurrentPageIndex() + 1;
          indicador.textContent = `${cur} / ${numPages}`;
          btnPrev.disabled = cur <= 1;
          btnNext.disabled = cur >= numPages;
        }
        pageFlip.on('flip', updateUI);
        updateUI();

        btnPrev.addEventListener('click', () => { pageFlip.flipPrev(); });
        btnNext.addEventListener('click', () => { pageFlip.flipNext(); });

        // Teclas
        document.addEventListener('keydown', e => {
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') pageFlip.flipNext();
          if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   pageFlip.flipPrev();
        });

        // Swipe celular
        let tx = 0;
        bookContainer.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
        bookContainer.addEventListener('touchend', e => {
          const d = tx - e.changedTouches[0].clientX;
          if (Math.abs(d) > 40) { d > 0 ? pageFlip.flipNext() : pageFlip.flipPrev(); }
        }, { passive: true });

        // Pantalla completa
        btnFs.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(console.error);
          } else { document.exitFullscreen(); }
        });
        document.addEventListener('fullscreenchange', () => {
          setTimeout(() => pageFlip.update(), 300);
        });

      } catch (e) {
        console.error(e);
        document.getElementById('loader').innerText =
          'Error al cargar revista.pdf. Verificá que esté en la misma carpeta.';
      }
    });
  </script>
</body>
</html>
