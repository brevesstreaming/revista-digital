<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revista Interactiva - Breves</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
    
    <style>
        body { 
            background: #1c1c1c; 
            margin: 0;
            padding: 0;
            display: flex; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        /* Contenedor adaptativo centrado */
        #book-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 95vw;
            height: 80vh;
        }

        #book-container { 
            box-shadow: 0 10px 40px rgba(0,0,0,0.9); 
            display: none; /* Se activa al renderizar las hojas */
        }

        .page { 
            background-color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.15);
        }

        /* Ajuste de imagen interna */
        canvas { 
            width: 100% !important;
            height: 100% !important;
            object-fit: contain; 
        }

        /* Botones de navegación */
        .controles {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .btn-nav {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn-nav:hover {
            background-color: #555;
        }

        #loader {
            color: #ccc;
            font-size: 18px;
            position: absolute;
        }
    </style>
</head>
<body>
    
    <div id="loader">Procesando páginas de la revista...</div>
    
    <div id="book-wrapper">
        <div id="book-container"></div>
    </div>

    <div class="controles" id="controles-panel" style="display: none;">
        <button class="btn-nav" id="btn-prev">◀ Anterior</button>
        <button class="btn-nav" id="btn-next">Siguiente ▶</button>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const pdfUrl = 'revista.pdf'; 

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
                const bookContainer = document.getElementById('book-container');
                const loader = document.getElementById('loader');
                const controles = document.getElementById('controles-panel');
                const numPages = pdf.numPages; 

                // 1. OBTENER PROPORCIÓN DEL PDF (Relación de aspecto real)
                const firstPage = await pdf.getPage(1);
                const originalViewport = firstPage.getViewport({ scale: 1.0 });
                const ratio = originalViewport.width / originalViewport.height;

                // 2. CALCULAR TAMAÑO MÁXIMO EN BASE A LA PANTALLA DISPONIBLE
                const maxWidth = window.innerWidth * 0.9;  // 90% del ancho de la pantalla
                const maxHeight = window.innerHeight * 0.75; // 75% del alto de la pantalla

                let finalWidth = maxWidth;
                let finalHeight = (maxWidth / 2) / ratio; // Dividido 2 porque son 2 páginas abiertas

                // Si al calcular el alto se nos pasa del límite físico de la pantalla, recalculamos en base al alto
                if (finalHeight > maxHeight) {
                    finalHeight = maxHeight;
                    finalWidth = (maxHeight * ratio) * 2;
                }

                // Ajustamos el contenedor al tamaño definitivo calculado
                bookContainer.style.width = `${Math.round(finalWidth)}px`;
                bookContainer.style.height = `${Math.round(finalHeight)}px`;

                // 3. RENDERIZAR LAS PÁGINAS DEL PDF EN LOS LIENZOS
                for (let i = 1; i <= numPages; i++) {
                    const page = await pdf.getPage(i);
                    // Usamos una escala intermedia-alta para equilibrar excelente calidad y rendimiento
                    const viewport = page.getViewport({ scale: 1.6 });
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    pageDiv.appendChild(canvas);
                    bookContainer.appendChild(pageDiv);
                }

                // Ocultar cargador y mostrar elementos del visor
                loader.style.display = 'none';
                bookContainer.style.display = 'block';
                controles.style.display = 'flex';

                // 4. INICIALIZAR EL VISOR FLIPBOOK
                const pageFlip = new St.PageFlip(bookContainer, {
                    width: Math.round(finalWidth / 2), // Ancho de una página individual
                    height: Math.round(finalHeight),   // Alto del libro completo
                    showCover: true,
                    usePortrait: false,
                    drawShadow: true,
                    flippingTime: 800 // Velocidad suave del efecto en milisegundos
                });
                
                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                // Controladores de botones
                document.getElementById('btn-prev').addEventListener('click', () => {
                    pageFlip.flipPrev();
                });
                document.getElementById('btn-next').addEventListener('click', () => {
                    pageFlip.flipNext();
                });

            } catch (error) {
                console.error("Error al cargar el PDF: ", error);
                document.getElementById('loader').innerText = "Error al procesar el archivo PDF de la revista.";
            }
        });
    </script>
</body>
</html>
